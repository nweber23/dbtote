version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: dbtote
    main: ./cmd/dbtote
    binary: dbtote
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/nweber23/dbtote/internal/cli.Version={{.Version}}
      - -X github.com/nweber23/dbtote/internal/cli.Commit={{.Commit}}
      - -X github.com/nweber23/dbtote/internal/cli.BuildDate={{.Date}}

archives:
  - id: dbtote
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-amd64"
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
  - image_templates:
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-arm64"
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release

docker_manifests:
  - name_template: "ghcr.io/nweber23/dbtote:{{ .Version }}"
    image_templates:
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-amd64"
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-arm64"
  - name_template: "ghcr.io/nweber23/dbtote:latest"
    image_templates:
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-amd64"
      - "ghcr.io/nweber23/dbtote:{{ .Version }}-arm64"
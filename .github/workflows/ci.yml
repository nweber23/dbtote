name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  vet-lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed for the coverage comment step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: go test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic
      - name: Compute coverage percentage
        id: coverage
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pct = "${{ steps.coverage.outputs.percentage }}";
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Coverage: ${pct} on \`internal/\` (target: >75%, tracked per SPEC.md Section 12 — not a hard merge gate).`,
            });

  build-matrix:
    needs: vet-lint-test
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Compile-only build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/dbtote

  integration-test:
    needs: vet-lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: go test -tags=integration
        run: go test -tags=integration ./... -v